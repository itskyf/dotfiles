[bootstrap.packages]
"brew:bat" = "latest"
"brew:chafa" = "latest"
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:gh" = "latest"
"brew:git-delta" = "latest"
"brew:herdr" = "latest"
"brew:ripgrep" = "latest"
"brew:sk" = "latest"
"brew:starship" = "latest"
"brew:topgrade" = "latest"
"brew:zoxide" = "latest"
"brew:gitnr" = "latest"

[bootstrap.repos]
"~/Projects/HCMUS/krinode" = { url = "https://github.com/itskyf/krinode.git" }

[dotfiles]
"~/.apm" = ".apm"
"~/.config" = { source = ".config", mode = "symlink-each", manifest = "git", exclude = ["/nvim", "/starship.toml.tera"] }
"~/.config/nvim" = ".config/nvim"
"~/.config/starship.toml" = { source = ".config/starship.toml.tera", mode = "template" }
"~/.gitconfig" = ".gitconfig"
"~/.var" = { source = ".var", mode = "symlink-each", manifest = "git" }

[settings]
activate_shims = false
not_found_system_fallback = false
paranoid = true
tool_update.global_auto = true

[settings.github]
credential_command = "gh auth token"

[settings.self_update]
auto = true

[tools]
"aqua:neovim/neovim" = "0.12"
"github:docker/docker-language-server" = "latest"
"github:EmmyLuaLs/emmylua-analyzer-rust" = { version = "latest", matching_regex = "^emmylua_ls-" }
node = "latest"
"npm:bash-language-server" = "latest"
"npm:fish-lsp" = "latest"
"npm:yaml-language-server" = "latest"
tree-sitter = "latest"
fnox = { version = "latest", workflow = "release.yml" }
uv = "latest"
apm = "latest"
