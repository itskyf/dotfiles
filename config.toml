[bootstrap.packages]
"brew:bat" = "latest"
"brew:chafa" = "latest"
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:gh" = "latest"
"brew:git-delta" = "latest"
"brew:herdr" = "latest"
"brew:ripgrep" = "latest"
"brew:sk" = "latest"
"brew:starship" = "latest"
"brew:topgrade" = "latest"
"brew:zoxide" = "latest"
"brew:gitnr" = "latest"

[bootstrap.repos]
"~/Projects/HCMUS/krinode" = { url = "https://github.com/itskyf/krinode.git" }

[dotfile_groups.home]
root = "."
target = "~"
mode = "symlink-each"

[dotfile_groups.home.entries]
"~/.apm" = { mode = "symlink" }
"~/.config/nvim" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "template" }

[settings]
dotfiles.root = "~/.config/mise/home"
activate_shims = false
not_found_system_fallback = false
paranoid = true
tool_update.global_auto = true

[settings.github]
credential_command = "gh auth token"

[settings.self_update]
auto = true

[tools]
"aqua:neovim/neovim" = "0.12"
"github:docker/docker-language-server" = "latest"
"github:EmmyLuaLs/emmylua-analyzer-rust" = { version = "latest", matching_regex = "^emmylua_ls-" }
node = "latest"
"npm:bash-language-server" = "latest"
"npm:fish-lsp" = "latest"
"npm:yaml-language-server" = "latest"
tree-sitter = "latest"
fnox = { version = "latest", workflow = "release.yml" }
uv = "latest"
apm = "latest"
