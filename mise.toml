[tools]
"aqua:Kampfkarren/selene" = "latest"
biome = "latest"
hk = { version = "latest" }
stylua = "latest"
tombi = "latest"

[dotfiles]
"~/.apm" = ".apm"
"~/.config" = { source = ".config", mode = "symlink-each", manifest = "git", exclude = ["/mise", "/nvim", "/starship.toml.tera"] }
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml", mode = "copy" }
"~/.config/nvim" = ".config/nvim"
"~/.config/starship.toml" = { source = ".config/starship.toml.tera", mode = "template" }
"~/.gitconfig" = ".gitconfig"
"~/.var/app/io.mpv.Mpv/config/mpv/mpv.conf" = ".var/app/io.mpv.Mpv/config/mpv/mpv.conf"
